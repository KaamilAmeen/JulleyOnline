<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="820" viewBox="0 0 1720 820" role="img" aria-labelledby="title desc">
  <title id="title">JulleyOnline database ER diagram</title>
  <desc id="desc">Nine tables: organizations, tenants, users, memberships, boards, columns, tasks, activity_logs and refresh_tokens. Tenants own boards, columns and tasks; memberships link users to organizations and tenants.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .hdr { rx: 9; }
      .name { font: 700 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .field { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .muted { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .tag { font: 700 9px ui-sans-serif, system-ui, sans-serif; }
      .rel { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .rel-dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; }
      .label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .legend { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1720" height="820" />

  <!-- ============================ RELATIONSHIPS ============================ -->
  <path class="rel" d="M320 110 H380" marker-end="url(#arrow)" />
  <text class="label" x="326" y="102">1 : N</text>

  <path class="rel" d="M660 110 H720" marker-end="url(#arrow)" />
  <text class="label" x="666" y="102">1 : N</text>

  <path class="rel" d="M1000 110 H1060" marker-end="url(#arrow)" />
  <text class="label" x="1006" y="102">1 : N</text>

  <path class="rel" d="M1340 110 H1400" marker-end="url(#arrow)" />
  <text class="label" x="1346" y="102">1 : N</text>

  <!-- organization_id denormalized onto boards -->
  <path class="rel-dash" d="M180 40 V20 H860 V40" marker-end="url(#arrow-dash)" />
  <text class="label" x="470" y="14">organization_id (denormalized for org-level reporting)</text>

  <!-- tenant_id denormalized onto columns -->
  <path class="rel-dash" d="M520 40 V10 H1200 V40" marker-end="url(#arrow-dash)" />
  <text class="label" x="800" y="6">tenant_id on every child row</text>

  <!-- organizations -> memberships -->
  <path class="rel" d="M180 190 V270 H400 V330" marker-end="url(#arrow)" />
  <text class="label" x="196" y="262">1 : N</text>

  <!-- tenants -> memberships -->
  <path class="rel" d="M520 210 V330" marker-end="url(#arrow)" />
  <text class="label" x="528" y="250">1 : N</text>

  <!-- users -> memberships -->
  <path class="rel" d="M320 430 H380" marker-end="url(#arrow)" />
  <text class="label" x="326" y="422">1 : N</text>

  <!-- users -> tasks (assignee / creator) -->
  <path class="rel" d="M40 430 H20 V300 H1500 V280" marker-end="url(#arrow)" />
  <text class="label" x="880" y="294">assigned_to / created_by (0..N)</text>

  <!-- activity -> users -->
  <path class="rel" d="M860 540 V590 H180 V520" marker-end="url(#arrow)" />
  <text class="label" x="470" y="584">user_id (1 : N)</text>

  <!-- activity -> tenants -->
  <path class="rel" d="M900 330 V290 H600 V210" marker-end="url(#arrow)" />
  <text class="label" x="608" y="284">tenant_id (1 : N)</text>

  <!-- users -> refresh tokens -->
  <path class="rel" d="M180 520 V620" marker-end="url(#arrow)" />
  <text class="label" x="188" y="576">1 : N</text>

  <!-- ============================ ENTITIES ============================ -->
  <!-- organizations -->
  <rect class="box" x="40" y="40" width="280" height="150" />
  <path class="hdr" fill="#4f46e5" d="M40 49 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="56" y="63">organizations</text>
  <text class="field" x="52" y="94">id</text><text class="tag" x="286" y="94" fill="#4f46e5">PK</text>
  <text class="field" x="52" y="114">name</text>
  <text class="field" x="52" y="134">slug</text><text class="tag" x="278" y="134" fill="#4f46e5">UQ</text>
  <text class="muted" x="52" y="154">created_at</text>
  <text class="muted" x="52" y="174">updated_at</text>

  <!-- tenants -->
  <rect class="box" x="380" y="40" width="280" height="170" />
  <path class="hdr" fill="#0284c7" d="M380 49 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="396" y="63">tenants</text>
  <text class="field" x="392" y="94">id</text><text class="tag" x="626" y="94" fill="#4f46e5">PK</text>
  <text class="field" x="392" y="114">organization_id</text><text class="tag" x="602" y="114" fill="#0284c7">FK</text>
  <text class="field" x="392" y="134">name</text>
  <text class="field" x="392" y="154">slug</text><text class="tag" x="618" y="154" fill="#4f46e5">UQ*</text>
  <text class="muted" x="392" y="174">created_at</text>
  <text class="muted" x="392" y="194">updated_at</text>

  <!-- boards -->
  <rect class="box" x="720" y="40" width="280" height="170" />
  <path class="hdr" fill="#059669" d="M720 49 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="736" y="63">boards</text>
  <text class="field" x="732" y="94">id</text><text class="tag" x="966" y="94" fill="#4f46e5">PK</text>
  <text class="field" x="732" y="114">organization_id</text><text class="tag" x="942" y="114" fill="#0284c7">FK</text>
  <text class="field" x="732" y="134">tenant_id</text><text class="tag" x="942" y="134" fill="#0284c7">FK</text>
  <text class="field" x="732" y="154">name</text>
  <text class="field" x="732" y="174">created_by</text><text class="tag" x="942" y="174" fill="#0284c7">FK</text>
  <text class="muted" x="732" y="194">created_at</text>

  <!-- columns -->
  <rect class="box" x="1060" y="40" width="280" height="150" />
  <path class="hdr" fill="#0d9488" d="M1060 49 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="1076" y="63">columns</text>
  <text class="field" x="1072" y="94">id</text><text class="tag" x="1306" y="94" fill="#4f46e5">PK</text>
  <text class="field" x="1072" y="114">board_id</text><text class="tag" x="1282" y="114" fill="#0284c7">FK</text>
  <text class="field" x="1072" y="134">tenant_id</text><text class="tag" x="1282" y="134" fill="#0284c7">FK</text>
  <text class="field" x="1072" y="154">name</text>
  <text class="field" x="1072" y="174">position</text>

  <!-- tasks -->
  <rect class="box" x="1400" y="40" width="280" height="240" />
  <path class="hdr" fill="#d97706" d="M1400 49 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="1416" y="63">tasks</text>
  <text class="field" x="1412" y="94">id</text><text class="tag" x="1646" y="94" fill="#4f46e5">PK</text>
  <text class="field" x="1412" y="114">board_id</text><text class="tag" x="1622" y="114" fill="#0284c7">FK</text>
  <text class="field" x="1412" y="134">column_id</text><text class="tag" x="1622" y="134" fill="#0284c7">FK</text>
  <text class="field" x="1412" y="154">tenant_id</text><text class="tag" x="1622" y="154" fill="#0284c7">FK</text>
  <text class="field" x="1412" y="174">title</text>
  <text class="field" x="1412" y="194">priority</text>
  <text class="field" x="1412" y="214">assigned_to</text><text class="tag" x="1622" y="214" fill="#0284c7">FK</text>
  <text class="field" x="1412" y="234">position · version</text>
  <text class="muted" x="1412" y="254">created_at · due_date</text>

  <!-- users -->
  <rect class="box" x="40" y="330" width="280" height="190" />
  <path class="hdr" fill="#7c3aed" d="M40 339 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="56" y="353">users</text>
  <text class="field" x="52" y="384">id</text><text class="tag" x="286" y="384" fill="#4f46e5">PK</text>
  <text class="field" x="52" y="404">name</text>
  <text class="field" x="52" y="424">email</text><text class="tag" x="278" y="424" fill="#4f46e5">UQ</text>
  <text class="muted" x="52" y="444">password_hash</text>
  <text class="field" x="52" y="464">avatar_color</text>
  <text class="muted" x="52" y="484">created_at</text>

  <!-- memberships -->
  <rect class="box" x="380" y="330" width="280" height="190" />
  <path class="hdr" fill="#db2777" d="M380 339 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="396" y="353">memberships</text>
  <text class="field" x="392" y="384">id</text><text class="tag" x="626" y="384" fill="#4f46e5">PK</text>
  <text class="field" x="392" y="404">user_id</text><text class="tag" x="602" y="404" fill="#0284c7">FK</text>
  <text class="field" x="392" y="424">organization_id</text><text class="tag" x="602" y="424" fill="#0284c7">FK</text>
  <text class="field" x="392" y="444">tenant_id</text><text class="tag" x="602" y="444" fill="#0284c7">FK?</text>
  <text class="field" x="392" y="464">role</text>
  <text class="muted" x="392" y="484">created_at</text>
  <text class="muted" x="392" y="504">UNIQUE(user_id, tenant_id)</text>

  <!-- activity_logs -->
  <rect class="box" x="720" y="330" width="280" height="210" />
  <path class="hdr" fill="#475569" d="M720 339 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="736" y="353">activity_logs</text>
  <text class="field" x="732" y="384">id</text><text class="tag" x="966" y="384" fill="#4f46e5">PK</text>
  <text class="field" x="732" y="404">tenant_id</text><text class="tag" x="942" y="404" fill="#0284c7">FK</text>
  <text class="field" x="732" y="424">organization_id</text><text class="tag" x="942" y="424" fill="#0284c7">FK</text>
  <text class="field" x="732" y="444">user_id</text><text class="tag" x="942" y="444" fill="#0284c7">FK</text>
  <text class="field" x="732" y="464">entity_type · entity_id</text>
  <text class="field" x="732" y="484">action</text>
  <text class="field" x="732" y="504">details (JSONB)</text>
  <text class="muted" x="732" y="524">created_at</text>

  <!-- refresh_tokens -->
  <rect class="box" x="40" y="620" width="280" height="150" />
  <path class="hdr" fill="#dc2626" d="M40 629 a9 9 0 0 1 9 -9 h262 a9 9 0 0 1 9 9 v23 h-280 z" />
  <text class="name" x="56" y="643">refresh_tokens</text>
  <text class="field" x="52" y="674">id</text><text class="tag" x="286" y="674" fill="#4f46e5">PK</text>
  <text class="field" x="52" y="694">user_id</text><text class="tag" x="262" y="694" fill="#0284c7">FK</text>
  <text class="field" x="52" y="714">token_hash</text><text class="tag" x="278" y="714" fill="#4f46e5">UQ</text>
  <text class="muted" x="52" y="734">expires_at · revoked_at</text>
  <text class="muted" x="52" y="754">created_at</text>

  <!-- legend -->
  <rect x="1060" y="620" width="620" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" />
  <text class="legend" x="1080" y="648" font-weight="700" fill="#0f172a">How to read this diagram</text>
  <text class="legend" x="1080" y="674">PK primary key · FK foreign key · UQ unique · UQ* unique per organization</text>
  <text class="legend" x="1080" y="698">Solid arrows are enforced relations. Dashed arrows show denormalized</text>
  <text class="legend" x="1080" y="720">organization_id / tenant_id columns that make every scoped query indexable.</text>
  <text class="legend" x="1080" y="744" fill="#0f172a" font-weight="600">Rule: every tenant-owned row is filtered by tenant_id on every read and write.</text>
  <text class="legend" x="1080" y="764">A NULL memberships.tenant_id means an organization-wide ORG_ADMIN grant.</text>
</svg>
